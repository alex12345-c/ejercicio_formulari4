
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulari d'inscripció</title>
</head>
<body>

    <h1>Formulari d'inscripció</h1>
    <p>Activitats extraescolars - Curs 2026-2027</p>

    <form>

        <fieldset>
            <legend>1. Dades personals</legend>

            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom" required>

            <label for="cognoms">Cognoms</label>
            <input type="text" id="cognoms" name="cognoms" placeholder="Escriu els cognoms" required>

            <label for="email">Correu electrònic</label>
            <input type="email" id="email" name="email" placeholder="exemple@correu.com" required>

            <label for="telefon">Telèfon</label>
            <input type="tel" id="telefon" maxlength="11" name="telefon" placeholder="600 000 000">

            <label for="data">Data de naixement</label>
            <input type="date" id="data" name="data" required>

            <label for="password">Contrasenya</label>
            <input type="password" id="password" name="password" placeholder="Introdueix una contrasenya" required>

        </fieldset>


        <fieldset>
            <legend>2. Informació acadèmica</legend>

            <label for="curs">Curs actual</label>

            <select id="curs" name="curs" required>
                <option value="">Selecciona un curs</option>
                <option value="1r SMX">1r SMX</option>
                <option value="2n SMX">2n SMX</option>
            </select>

            <p>Activitat que vols realitzar</p>

            <input type="radio" name="activitat" id="programacio" value="programacio" required>
            <label for="programacio">Programació</label>
            <br>

            <input type="radio" name="activitat" id="robotica" value="robotica">
            <label for="robotica">Robòtica</label>
            <br>

            <input type="radio" name="activitat" id="disseny" value="disseny">
            <label for="disseny">Disseny web</label>
            <br>
            
            <input type="radio" name="activitat" id="esports" value="esports">
            <label for="esports">Esports</label>
            <br>

            <p>Dies disponibles</p>
            
            <input type="checkbox" name="dies" id="dilluns" value="dilluns">
            <label for="dilluns">Dilluns</label><br>
            
            <input type="checkbox" name="dies" id="dimarts" value="dimarts">
            <label for="dimarts">Dimarts</label><br>
            
            <input type="checkbox" name="dies" id="dimecres" value="dimecres">
            <label for="dimecres">Dimecres</label><br>
            
            <input type="checkbox" name="dies" id="dijous" value="dijous">
            <label for="dijous">Dijous</label><br>
            
            <input type="checkbox" name="dies" id="divendres" value="divendres">
            <label for="divendres">Divendres</label><br>

        </fieldset>


        <fieldset>
            <legend>3. Informació addicional</legend>

            <label for="color">Color preferit per a la teva identificació</label>
            <input type="color" id="color" name="color" value="#4285db"><br>

            <label for="nivell">Nivell d'experiència de 0 a 10</label>
            <input type="range" id="nivell" name="nivell" min="0" max="10" value="5"><br>

            <label for="comentaris">Comentaris o observacions</label><br>
            <textarea id="comentaris" name="comentaris" rows="4" cols="50" placeholder="Escriu aquí els teus comentaris..."></textarea><br>

            <input type="checkbox" id="condicions" name="condicions" value="si" required>
            <label for="condicions">Accepto la política de privacitat i les condicions d'inscripció.</label>

        </fieldset>

        <button type="submit">Enviar inscripció</button>
        <button type="reset">Netejar</button>

    </form>

</body>
</html>
